name: Validate Quarto and interactive components
on:
  pull_request:
    branches: [version-9-julio]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Check JavaScript syntax
        run: |
          node --check assets/sustancia-interactions.js
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('assets/language-switch.html','utf8').replace(/^<script>\\s*|\\s*<\\/script>$/g,'');new vm.Script(s)"
      - name: Render complete website
        run: quarto render
      - name: Check generated pages and HTML components
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ["index", "pedagogia", "fundamentacion", "como-funciona", "universidades", "equipo", "piloto"]
          for name in pages:
              p = Path("_site") / (name + ".html")
              assert p.exists(), f"Página faltante: {p}"
              html = p.read_text(encoding="utf-8")
              assert "quarto-bootstrap" in html, f"No se cargaron estilos Quarto: {name}"
              assert "&lt;div class=" not in html, f"HTML visible como código en: {name}"
              print(f"OK: {name}.html")
          home = Path("_site/index.html").read_text(encoding="utf-8")
          pedagogy = Path("_site/pedagogia.html").read_text(encoding="utf-8")
          assert 'id="intro-splash"' in home and 'id="intro-video"' in home
          assert 'class="cita-marco"' in home and '<video' in home
          assert 'data-s3-examples' in home
          assert 'data-s3-mastery' in pedagogy and 'data-s3-radar' in pedagogy
          assert 'data-s3-dimensions' in pedagogy and 'data-s3-examples' in pedagogy
          assert Path("_site/assets/sustancia-interactions.js").exists()
          print("OK: interacción, video y componentes renderizados como HTML")
          # Every section must have a directly readable English counterpart.
          for name in pages:
              p=Path("_site/en")/(name+".html")
              assert p.exists(), f"English page missing: {p}"
              html=p.read_text(encoding="utf-8")
              assert 'lang="en"' in html[:500], f"English language metadata missing: {name}"
              assert '<html' in html
              assert '&lt;div class=' not in html, f"Escaped component in English page: {name}"
              assert 'language-switch' in html or 'Ver esta página' in html, f"Language switch missing: {name}"
              assert 'href="../assets/' not in html or (Path("_site/assets/sustancia-interactions.js")).exists()
              print(f"OK: en/{name}.html")
          enhome=Path("_site/en/index.html").read_text(encoding="utf-8")
          enpedagogy=Path("_site/en/pedagogia.html").read_text(encoding="utf-8")
          assert 'Reading a table is not the same as interpreting it.' in enhome
          assert 'data-s3-examples' in enhome
          assert 'data-s3-mastery' in enpedagogy
          assert 'data-s3-dimensions' in enpedagogy
          assert Path("_site/assets/sustancia-interactions.js").exists()
          # All local English-to-English links must resolve within the generated site.
          import re
          for name in pages:
              p=Path("_site/en")/(name+".html")
              html=p.read_text(encoding="utf-8")
              for href in re.findall(r'href="([^"]+)"',html):
                  if href.startswith(("http:","https:","#","mailto:","javascript:")):
                      continue
                  if href.endswith(".qmd"):
                      raise AssertionError(f"Unrendered QMD link in {p}: {href}")
                  if href.endswith(".html"):
                      assert (p.parent/href).resolve().exists(), f"Broken internal link in {p}: {href}"
          print("OK: both languages, translated HTML metadata, equivalent sections and working links")
          PY
