<!-- Shared, self-contained wetland: no remote assets or animation dependencies. -->
<style>
.s4-wetland{position:relative;width:100%;flex-shrink:0;overflow:hidden;background:linear-gradient(180deg,#16265f 0%,#243d60 65%,#203d38 100%);color:#f7f7f2;isolation:isolate}
.s4-wetland svg{display:block;width:100%;height:auto;min-height:200px;max-height:390px}
.s4-wetland-bar{position:absolute;top:18px;left:clamp(18px,4vw,64px);right:clamp(18px,4vw,64px);display:flex;justify-content:space-between;align-items:center;gap:16px;z-index:1}
.s4-wetland-label{font:500 11px/1.4 'IBM Plex Mono',monospace;letter-spacing:.17em;text-transform:uppercase;color:#e0dec2}
.s4-wetland button{font:500 12px/1.4 'IBM Plex Sans',sans-serif;color:#f7f7f2;background:#16265f;border:1px solid #85989f;border-radius:30px;padding:9px 14px;cursor:pointer;min-height:40px}
.s4-wetland button:hover{background:#314c72}.s4-wetland button:focus-visible{outline:3px solid #f1cf83;outline-offset:3px}
.s4-wetland .s4-walk{animation:s4-walk 16s ease-in-out infinite}.s4-wetland .s4-young{animation:s4-chase 12s ease-in-out infinite}.s4-wetland .s4-bob{animation:s4-bob 3s ease-in-out infinite}.s4-wetland .s4-swim{animation:s4-swim 19s ease-in-out infinite}.s4-wetland .s4-hop{animation:s4-hop 7s ease-in-out infinite}.s4-wetland .s4-fly{animation:s4-fly 9s ease-in-out infinite}.s4-wetland .s4-reed{transform-box:fill-box;transform-origin:bottom center;animation:s4-reed 5s ease-in-out infinite alternate}.s4-wetland .s4-ripple{transform-box:fill-box;transform-origin:center;animation:s4-ripple 4s ease-out infinite}.s4-wetland .s4-blink{animation:s4-blink 6s steps(1) infinite}
.s4-wetland[data-paused=true] svg *, .s4-wetland[data-away=true] svg *{animation-play-state:paused!important}
@keyframes s4-walk{0%,100%{transform:translateX(0)}50%{transform:translateX(80px)}}
@keyframes s4-chase{0%,100%{transform:translate(0,0)}30%{transform:translate(62px,-5px)}55%{transform:translate(90px,0)}75%{transform:translate(28px,-7px)}}
@keyframes s4-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes s4-swim{0%,100%{transform:translateX(0)}50%{transform:translateX(-95px)}}
@keyframes s4-hop{0%,65%,100%{transform:translate(0,0)}72%{transform:translate(15px,-20px)}79%,90%{transform:translate(30px,0)}95%{transform:translate(15px,-16px)}}
@keyframes s4-fly{0%,100%{transform:translate(0,0)}35%{transform:translate(55px,-13px)}70%{transform:translate(-20px,8px)}}
@keyframes s4-reed{to{transform:rotate(4deg)}}
@keyframes s4-ripple{0%{opacity:.55;transform:scaleX(.8)}100%{opacity:.08;transform:scaleX(1.3)}}
@keyframes s4-blink{0%,94%,100%{opacity:1}96%{opacity:0}}
@media(max-width:600px){.s4-wetland svg{height:250px;min-height:0}.s4-wetland-label{font-size:9px;max-width:150px}.s4-wetland-bar{top:12px}}
@media(prefers-reduced-motion:reduce){.s4-wetland svg *{animation:none!important}}
</style>

<script>
(function(){
  'use strict';
  function initWetland(){
    var scene=document.getElementById('sustancia-wetland');
    if(!scene)return;
    // Keep the habitat at the true end of every page, after Quarto's footer.
    document.body.appendChild(scene);
    var english=/\/en\//.test(location.pathname);
    var button=scene.querySelector('button');
    var media=window.matchMedia('(prefers-reduced-motion: reduce)');
    var paused=media.matches;
    function update(){
      scene.dataset.paused=String(paused||media.matches);
      button.setAttribute('aria-pressed',String(paused||media.matches));
      button.textContent=media.matches?(english?'Motion reduced':'Movimiento reducido'):(paused?(english?'Resume animation':'Reanudar animación'):(english?'Pause animation':'Pausar animación'));
      button.disabled=media.matches;
    }
    if(english){
      scene.setAttribute('aria-label','Sustancia wetland');
      scene.querySelector('.s4-wetland-label').textContent='A pause by the wetland';
      scene.querySelector('title').textContent='A little wetland full of life';
      scene.querySelector('desc').textContent='Three capybaras walk, play and bathe with a duck, a turtle, a frog and dragonflies among reeds and water lilies.';
    }
    button.addEventListener('click',function(){paused=!paused;update();});
    media.addEventListener('change',function(){paused=media.matches;update();});
    update();
    var narrow=window.matchMedia('(max-width: 600px)');
    function fit(){scene.querySelector('svg').setAttribute('viewBox',narrow.matches?'180 0 840 350':'0 0 1200 350');}
    narrow.addEventListener('change',fit);fit();
    if('IntersectionObserver' in window){new IntersectionObserver(function(entries){scene.dataset.away=String(!entries[0].isIntersecting);},{rootMargin:'80px'}).observe(scene);}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initWetland,{once:true});else initWetland();
})();
</script>
