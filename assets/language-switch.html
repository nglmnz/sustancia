<script>
(function(){
  "use strict";
  var slugs=["index","fundamentacion","pedagogia","como-funciona","universidades","equipo","piloto"];
  var labels={
    es:{"fundamentacion":"Fundamentación","pedagogia":"Modelo pedagógico","como-funciona":"Cómo funciona","universidades":"Universidades","equipo":"Equipo","piloto":"Prototipo"},
    en:{"fundamentacion":"Foundations","pedagogia":"Pedagogical model","como-funciona":"How it works","universidades":"Universities","equipo":"Team","piloto":"Prototype"},
    eu:{"fundamentacion":"Oinarri teorikoak","pedagogia":"Eredu pedagogikoa","como-funciona":"Nola funtzionatzen du?","universidades":"Unibertsitateak","equipo":"Lantaldea","piloto":"Prototipoa"}
  };
  var localeNames={es:"Español",en:"English",eu:"Euskara"};
  function init(){
    var path=window.location.pathname;
    var locale=/\/eu\//.test(path)?"eu":/\/en\//.test(path)?"en":"es";
    var base=path.replace(/(?:(?:en|eu)\/)?[^/]*$/,"");
    var slug=(path.split("/").pop()||"index.html").replace(/\.html$/,"");
    if(slugs.indexOf(slug)<0)slug="index";
    var prefix=function(lang){return lang==="es"?"":lang+"/";};
    var urlFor=function(lang,target){return base+prefix(lang)+target+".html";};
    document.documentElement.setAttribute("lang",locale);
    document.querySelectorAll(".navbar a[href]").forEach(function(a){
      var original=a.textContent.trim();
      var targetLanguage=Object.keys(localeNames).find(function(key){return original===localeNames[key];});
      if(targetLanguage){
        a.textContent=localeNames[targetLanguage];
        a.setAttribute("href",urlFor(targetLanguage,slug));
        a.setAttribute("hreflang",targetLanguage);
        a.setAttribute("lang",targetLanguage);
        a.setAttribute("aria-label",{
          es:"Ver esta página en español",
          en:"View this page in English",
          eu:"Ikusi orri hau euskaraz"
        }[targetLanguage]);
        a.classList.add("s3-language-switch");
        if(targetLanguage===locale){
          a.setAttribute("aria-current","page");
        }else{
          a.removeAttribute("aria-current");
        }
        return;
      }
      if(a.classList.contains("navbar-brand")||a.querySelector("img")){
        a.setAttribute("href",urlFor(locale,"index"));
        return;
      }
      try {
        var destination=new URL(a.getAttribute("href"),window.location.href);
        if(destination.origin!==window.location.origin)return;
        var match=destination.pathname.match(/\/(index|fundamentacion|pedagogia|como-funciona|universidades|equipo|piloto)\.html$/);
        if(!match)return;
        var target=match[1];
        a.setAttribute("href",urlFor(locale,target));
        if(labels[locale][target])a.textContent=labels[locale][target];
      }catch(e){}
    });
    var footer=document.querySelector(".nav-footer-center");
    if(footer){
      footer.textContent={
        es:"Sustancia · Proyecto interdisciplinario en investigación y desarrollo · 2026",
        en:"Sustancia · Interdisciplinary research and development project · 2026",
        eu:"Sustancia · Diziplinarteko ikerketa- eta garapen-proiektua · 2026"
      }[locale];
    }
    var input=document.querySelector(".aa-Input");
    if(input)input.setAttribute("placeholder",{es:"Buscar",en:"Search",eu:"Bilatu"}[locale]);
    ["es","en","eu"].forEach(function(lang){
      var alternate=document.createElement("link");
      alternate.setAttribute("rel","alternate");
      alternate.setAttribute("hreflang",lang);
      alternate.setAttribute("href",window.location.origin+urlFor(lang,slug));
      document.head.appendChild(alternate);
    });
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});
  else init();
})();
</script>
